<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="xau-endpoint" content="/api/submit">
<meta name="author" content="Veli Reci, FunnelMcQueen">
<meta name="theme-color" content="#1A1A1A">
<title>Pyetësori i strategjisë XAUUSD | FunnelMcQueen</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%231A1A1A'/%3E%3Cpath d='M22 14h14l-8 36H14z' fill='%23E10600'/%3E%3Cpath d='M40 14h10l-8 36H32z' fill='%23F4B400'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F4F5F7; --surface:#FFFFFF; --ink:#1A1A1A; --muted:#5B6168; --line:#D9DDE2; --line-strong:#B9BFC6;
  --red:#E10600; --red-ink:#B80500; --gold:#F4B400; --gold-soft:#FDF3D6;
  --sel:#1A1A1A; --sel-ink:#FFFFFF;
  --err:#B42318; --err-soft:#FDECEA; --ok:#1E7A46; --ok-soft:#E3F3E9; --focus:#1A1A1A;
  --font:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#141414; --surface:#1F1F1F; --ink:#F2F2F2; --muted:#A3A9B0; --line:#333333; --line-strong:#4A4A4A;
    --red:#E10600; --red-ink:#FF6B63; --gold:#F4B400; --gold-soft:#2E2610;
    --sel:#F2F2F2; --sel-ink:#141414;
    --err:#FF8A80; --err-soft:#3A1E1B; --ok:#6FCF97; --ok-soft:#173326; --focus:#F2F2F2;
  }
}
:root[data-theme="dark"]{
  --paper:#141414; --surface:#1F1F1F; --ink:#F2F2F2; --muted:#A3A9B0; --line:#333333; --line-strong:#4A4A4A;
  --red:#E10600; --red-ink:#FF6B63; --gold:#F4B400; --gold-soft:#2E2610;
  --sel:#F2F2F2; --sel-ink:#141414;
  --err:#FF8A80; --err-soft:#3A1E1B; --ok:#6FCF97; --ok-soft:#173326; --focus:#F2F2F2;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 16px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
[hidden]{display:none !important}
.wrap{max-width:660px;margin:0 auto;padding:0 20px}

/* Shiriti i markës */
.brandbar{background:var(--surface);border-bottom:1px solid var(--line)}
.brandbar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.mark{display:flex;gap:3px;height:20px}
.mark i{display:block;width:9px;height:20px;transform:skewX(-18deg);background:var(--red)}
.mark i + i{background:var(--gold)}
.wordmark{font-stretch:125%;font-weight:800;font-size:1.02rem;letter-spacing:-.01em;line-height:1}
.symbol{font-stretch:112%;font-weight:700;font-size:.82rem;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:3px 8px}

/* Titulli */
.intro-head{padding:30px 0 6px}
.intro-head h1{margin:0;font-size:clamp(1.65rem,6.4vw,2.2rem);line-height:1.12;font-weight:800;font-stretch:112%;letter-spacing:-.015em;max-width:18ch}
.intro-head p{margin:10px 0 0;color:var(--muted);max-width:52ch}
#stepline{margin:18px 0 0;font-size:.9rem;color:var(--muted)}
#banners{margin-top:4px}
.banner{margin:14px 0 0;padding:12px 14px;border-radius:6px;font-size:.92rem;border:1px solid var(--line);background:var(--surface)}
.banner.warn{border-color:var(--gold);background:var(--gold-soft)}
.banner.err{border-color:var(--err);background:var(--err-soft)}

/* Hapat */
main{padding-bottom:28px}
.step{padding:22px 0 0}
.screen-head{padding-top:16px;border-top:2px solid var(--ink);margin:0 0 22px}
.section-label{display:flex;align-items:center;gap:10px;margin:0 0 6px;font-size:.88rem;font-weight:700;color:var(--muted)}
.section-num{display:inline-grid;place-items:center;min-width:26px;height:26px;padding:0 6px;border-radius:4px;background:var(--red);color:#FFFFFF;font-stretch:125%;font-weight:800;font-size:.9rem}
.screen-head h2{margin:0 0 6px;font-size:1.38rem;line-height:1.22;font-weight:700}
.screen-head .intro{margin:0;color:var(--muted);font-size:.96rem;max-width:58ch}
.group-title{font-weight:700;font-size:.98rem;margin:8px 0 12px;padding-top:14px;border-top:1px solid var(--line)}

/* Pyetjet */
.q{border:0;margin:0 0 26px;padding:0;min-width:0}
.q > label.ql,.q > legend,.q > .ql{display:block;font-weight:600;font-size:1rem;margin:0 0 10px;padding:0}
.hint{display:block;font-weight:400;color:var(--muted);font-size:.88rem;margin-top:3px}
.hint.ex{font-style:italic}
.coverage{margin:4px 0 12px;font-size:.92rem;color:var(--muted)}
.settings-q{margin-top:8px;padding-top:16px;border-top:1px solid var(--line)}
.opt-tag{font-weight:400;color:var(--muted);font-size:.86rem}
.qerr{display:flex;gap:8px;align-items:flex-start;color:var(--err);font-size:.9rem;font-weight:600;margin:10px 0 0}
.qerr::before{content:"!";flex:none;display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--err);color:var(--surface);font-size:.75rem;font-weight:800;margin-top:1px}
.q.has-err{padding-left:12px;border-left:3px solid var(--err)}
.q.has-err input[type=text],.q.has-err input[type=email],.q.has-err input[type=time],.q.has-err input[type=date],.q.has-err textarea{border-color:var(--err)}

input[type=text],input[type=email],input[type=time],input[type=date],textarea{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line-strong);border-radius:6px;padding:12px 13px;min-height:48px}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.75}
input:disabled,textarea:disabled{opacity:.45}
textarea{min-height:116px;resize:vertical;line-height:1.5}
input:focus-visible,textarea:focus-visible,button:focus-visible,.upl:focus-visible,.chips input:focus-visible + span,.unk input:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
input:focus,textarea:focus{border-color:var(--ink)}
.num{display:flex;align-items:center;gap:8px}
.num input{flex:1 1 auto;min-width:0}
.num .unit{flex:0 1 auto;max-width:48%;color:var(--muted);font-size:.84rem;line-height:1.2}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips label{position:relative;cursor:pointer;max-width:100%}
.chips label span{max-width:100%}
.chips input{position:absolute;opacity:0;width:1px;height:1px}
.chips span{display:inline-flex;align-items:center;min-height:44px;padding:10px 16px;border:1px solid var(--line-strong);border-radius:999px;background:var(--surface);font-size:.95rem;line-height:1.3;user-select:none;transition:background .12s,border-color .12s,color .12s}
.chips label:hover span{border-color:var(--ink)}
.chips input:checked + span{background:var(--sel);border-color:var(--sel);color:var(--sel-ink);font-weight:600}
.chips label.unkchip span{border-style:dashed;color:var(--muted)}
.chips label.unkchip input:checked + span{background:var(--gold-soft);border:1px solid var(--gold);color:var(--ink)}
@media (prefers-reduced-motion:reduce){.chips span{transition:none}}
.unk{display:inline-flex;gap:8px;align-items:center;margin-top:10px;font-size:.88rem;color:var(--muted);cursor:pointer}
.unk input{width:18px;height:18px;accent-color:var(--ink);margin:0}

.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.row > .q{margin-bottom:20px}

.facts{list-style:none;margin:0 0 4px;padding:0;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.facts li{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-bottom:1px solid var(--line)}
.facts li:last-child{border-bottom:0}
.facts li::before{content:"✓";flex:none;display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--gold);color:#1A1A1A;font-size:.72rem;font-weight:800;margin-top:2px}

.info{margin:0 0 24px;font-size:.94rem}
.info strong{display:block;margin-bottom:3px}
.info.note{border-left:3px solid var(--gold);background:var(--gold-soft);padding:10px 14px;border-radius:0 6px 6px 0}
.info.section{padding-top:14px;border-top:1px solid var(--line)}
.info.section strong{font-size:1rem}
.info.section span{color:var(--muted)}

.ex{border:1px solid var(--line);border-left:3px solid var(--ink);border-radius:8px;background:var(--surface);padding:16px;margin:0 0 14px}
.ex-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;font-weight:700}
.ex .q{margin-bottom:18px}
.ex input[type=text],.ex input[type=time],.ex input[type=date],.ex textarea{background:var(--paper)}
.ex .chips span{background:var(--paper)}
.ex .chips input:checked + span{background:var(--sel)}
.photo{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.photo img{width:128px;height:84px;object-fit:cover;border:1px solid var(--line);border-radius:6px}
.upl{display:inline-flex;align-items:center;min-height:42px;cursor:pointer;padding:9px 16px;border:1px dashed var(--line-strong);border-radius:6px;color:var(--ink);font-weight:600;background:var(--surface)}
.upl:hover{border-color:var(--ink)}

button{font:inherit;cursor:pointer}
button.main,button.ghost,button.small{font-weight:700;border-radius:6px;padding:12px 20px;min-height:48px;border:2px solid transparent}
button.main{background:var(--red);border-color:var(--red);color:#FFFFFF}
button.main:hover{background:#C70500;border-color:#C70500}
button.ghost{background:transparent;color:var(--ink);border-color:var(--ink)}
button.small{padding:6px 12px;font-size:.88rem;min-height:36px;background:transparent;color:var(--ink);border:1px solid var(--line-strong)}
button:disabled{opacity:.55;cursor:default}

.review h3{font-size:1.02rem;margin:24px 0 8px}
.sum{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin:0 0 12px}
.sum-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.sum dl{margin:0}
.sum dt{color:var(--muted);font-size:.86rem;margin-top:8px}
.sum dd{margin:2px 0 0;font-weight:600;white-space:pre-wrap;overflow-wrap:anywhere}
.sum dd.unk-val{display:inline-block;background:var(--gold-soft);border:1px solid var(--gold);border-radius:4px;padding:1px 8px;font-weight:600}
.sum ul{margin:0;padding-left:20px}
.issues li{margin:0 0 8px}
.issues li button{margin-left:6px}
.review ul{margin:0;padding-left:20px}
.review li{margin:0 0 8px}
.review li button{margin-left:8px}
.status{border:1px solid var(--line);border-top:3px solid var(--ink);border-radius:8px;padding:16px;background:var(--surface);margin:0 0 18px}
.status p{margin:0 0 8px}
.status p:last-child{margin:0}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:.85rem;font-weight:700;margin-right:6px}
.badge.yes{background:var(--ok-soft);color:var(--ok)}
.badge.no{background:var(--gold-soft);color:var(--ink);border:1px solid var(--gold)}
.actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:16px}
#send-status{margin:14px 0 0;font-size:.95rem}
#send-status.ok{color:var(--ok);font-weight:600}
#send-status.err{color:var(--err);font-weight:600}
.fallback{margin-top:20px;border-top:1px solid var(--line);padding-top:16px}
.note{color:var(--muted);font-size:.9rem}

/* Nënshkrimi */
.signature{margin-top:36px;padding:22px 0 150px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:.86rem}
.signature .brand .wordmark{font-size:.9rem}
.signature .by{color:var(--ink);font-weight:600}

/* Shiriti poshtë: progresi me segmente */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);padding:10px 20px calc(10px + env(safe-area-inset-bottom,0px))}
.bar-in{max-width:660px;margin:0 auto}
.track{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:10px}
.track i{display:block;height:5px;border-radius:2px;background:var(--line);transform:skewX(-18deg)}
.track i.done{background:var(--ink)}
.track i.current{background:var(--red)}
.nav{display:flex;gap:10px}
.nav button{flex:1}
.saved{font-size:.78rem;color:var(--muted);text-align:center;margin-top:6px;min-height:1em}
</style>
</head>
<body>
<div class="brandbar">
  <div class="wrap">
    <span class="brand" aria-label="FunnelMcQueen"><span class="mark" aria-hidden="true"><i></i><i></i></span><span class="wordmark">FunnelMcQueen</span></span>
    <span class="symbol">XAUUSD.r</span>
  </div>
</div>
<div class="wrap">
  <header class="intro-head">
    <h1>Pyetësori i strategjisë</h1>
    <p>Rregullat e tua të tregtimit për robotin XAUUSD në MetaTrader 5. Nuk ka përgjigje të gabuara: kur nuk e di diçka, zgjidh "Nuk e di — ta sqarojmë bashkë". Përgjigjet ruhen vetë në këtë pajisje.</p>
    <p id="stepline"></p>
    <div id="banners"></div>
  </header>
  <noscript><p class="banner err">Ky pyetësor kërkon JavaScript.</p></noscript>
  <main id="app"></main>
  <footer class="signature">
    <span class="brand"><span class="mark" aria-hidden="true"><i></i><i></i></span><span class="wordmark">FunnelMcQueen</span></span>
    <span>Produkt i FunnelMcQueen, <span class="by">by Veli Reci</span></span>
  </footer>
</div>
<div class="bar">
  <div class="bar-in">
    <div class="track" id="track" aria-hidden="true"></div>
    <div class="nav">
      <button type="button" class="ghost" id="back">Prapa</button>
      <button type="button" class="main" id="next">Vazhdo</button>
    </div>
    <div class="saved" id="saved" aria-live="polite"></div>
  </div>
</div>
<script src="questionnaire.js"></script>
<script src="app.js"></script>
</body>
</html>
